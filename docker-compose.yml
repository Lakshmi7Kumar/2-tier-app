version: '3.8'

services:

  db:

    image: mysql:8

    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  web:

    build: ./app

    container_name: flask-app

    depends_on:
      - db

    environment:
      MYSQL_HOST: db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: mydb

    ports:
      - "5000:5000"

volumes:
  mysql-data:
